apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dms.fullname" . }}-test-decide
  labels:
    {{- include "dms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: decide
      image: {{ include "dms.image" . }}
      # The test asserts what a caller cares about: the evaluation runs inside the image with
      # no network and agrees with the committed baseline. It uses the same binary rather than
      # a curl image, so there is no second image to keep in step.
      args:
        - "--mode"
        - "eval"
        - "--provider"
        - {{ .Values.eval.provider | quote }}
        - "--baseline"
        - {{ .Values.eval.baseline | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
